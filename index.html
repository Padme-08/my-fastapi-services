<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cellphones Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Cellphones Hub</h1>
  </header>

  <main>
    <section class="search-container">
      <input type="text" id="searchInput" placeholder="Search for a cellphone...">
      <button onclick="searchCellphones()">Search</button>
      <button class="secondary" onclick="getAllCellphones()">Show All</button>
    </section>

    <section>
      <h2>Cellphones</h2>
      <div id="cellphonesList">
        Loading cellphones...
      </div>
    </section>
  </main>

  <!-- Pointing to app.js to match your folder structure -->
  <script src="app.js"></script>
</body>
</html>
