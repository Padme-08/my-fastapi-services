<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sports Hub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Sports Hub</h1>
    <p>A website powered by a REST API</p>
  </header>

  <main>
    <section class="search-container">
      <input type="text" id="searchInput" placeholder="Search for a sport...">
      <button onclick="searchSports()">Search</button>
      <button class="secondary" onclick="getAllSports()">Show All</button>
    </section>

    <section>
      <h2>Sports</h2>
      <div id="sportsList">
        Loading sports...
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
